name: Deploy external context

on:
  push:
    branches:
      - main
      - codex/link-context-v1
      - codex/static-html-context-v1
    paths:
      - public-context/**
      - context-src/**
      - scripts/build_external_context.py
      - scripts/promote_external_context.py
      - scripts/verify_http_endpoint.py
      - tests/**
      - .github/workflows/deploy-external-context.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: external-context-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated documents
        run: python3 scripts/build_external_context.py --check
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-context
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@v4
